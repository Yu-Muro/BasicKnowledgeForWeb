name: Pull Request Build & Test

env:
  NEXT_PUBLIC_API_URL: http://localhost:8080

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: $/.github/actions/setup-bun-project

      - name: Build backend
        run: |
          cd apps/backend
          bun run build

      - name: Lint backend code
        run: |
          cd apps/backend
          bun run lint

      - name: Type check backend
        run: |
          cd apps/backend
          bun run type-check

      - name: Test backend
        run: |
          cd apps/backend
          bun run test

  verify-migration-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: $/.github/actions/setup-bun-project

      - name: Start CockroachDB
        run: |
          docker run -d \
            --name cockroachdb \
            -p 26257:26257 \
            cockroachdb/cockroach:latest \
            start-single-node --insecure
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health?ready=1 > /dev/null 2>&1; then
              echo "CockroachDB is ready"
              break
            fi
            echo "Waiting for CockroachDB... ($i/30)"
            sleep 2
          done

      - name: Create database
        run: |
          docker exec cockroachdb cockroach sql --insecure \
            -e 'CREATE DATABASE IF NOT EXISTS "basic-knowledge-for-web";'

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://root@localhost:26257/basic-knowledge-for-web?sslmode=disable
        run: |
          cd apps/backend
          bun run db:migrate

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: $/.github/actions/setup-bun-project

      - name: Build for Cloudflare
        run: |
          cd apps/frontend
          bun run build:cloudflare

      - name: Lint frontend code
        run: |
          cd apps/frontend
          bun run lint

      - name: Type check frontend
        run: |
          cd apps/frontend
          bun run type-check

      - name: Test frontend
        run: |
          cd apps/frontend
          bun run test

  lint-and-test-email-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: $/.github/actions/setup-bun-project

      - name: Build email-worker
        run: |
          cd apps/email-worker
          bun run build

      - name: Lint email-worker code
        run: |
          cd apps/email-worker
          bun run lint

      - name: Type check email-worker
        run: |
          cd apps/email-worker
          bun run type-check

      - name: Test email-worker
        run: |
          cd apps/email-worker
          bun run test

  # Dependabot本人・同一リポジトリ・develop宛てのPRだけを対象にします。
  # メタデータが明示的にminor/patchの場合だけ承認・マージを有効にし、
  # majorや不明な更新種別は自動処理しません。
  dependabot-auto-merge:
    runs-on: ubuntu-slim
    if: >-
      startsWith(github.head_ref, 'dependabot/')
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.base_ref == 'develop'
      && github.repository == github.event.pull_request.head.repo.full_name
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    needs: ["lint-and-test-backend", "verify-migration-backend", "lint-and-test-frontend", "lint-and-test-email-worker"]
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # イベント発生後の別コミットや宛先変更を承認しないよう、現在のPRを確認します。
      - name: Re-check pull request
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" \
            | jq -e --arg sha "$PR_HEAD_SHA" --arg repo "$GH_REPO" '
                .user.login == "dependabot[bot]"
                and .base.ref == "develop"
                and .head.sha == $sha
                and .head.repo.full_name == $repo
                and .state == "open"
              '
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Pull Request
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            --raw-field event=APPROVE \
            --raw-field commit_id="$PR_HEAD_SHA"
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
