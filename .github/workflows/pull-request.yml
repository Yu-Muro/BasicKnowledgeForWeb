name: Pull Request Build & Test

env:
  NEXT_PUBLIC_API_URL: http://localhost:8080

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Check Wrangler ownership and bindings
        run: node infra/terraform/scripts/check-wrangler-ownership.mjs

      - name: Validate and test dev Terraform
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/dev validate
          terraform -chdir=infra/terraform/environments/dev test

      - name: Validate and test production Terraform
        run: |
          terraform -chdir=infra/terraform/environments/prod init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/prod validate
          terraform -chdir=infra/terraform/environments/prod test

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.repository == github.event.pull_request.head.repo.full_name
    environment: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
    env:
      TF_ENABLED: ${{ vars.TERRAFORM_IAC_ENABLED }}
      TF_ENVIRONMENT: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_PLAN_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_PLAN_STATE_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.TF_PLAN_CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_hyperdrive_name: ${{ vars.CLOUDFLARE_HYPERDRIVE_NAME }}
      TF_VAR_hyperdrive_origin: ${{ secrets.TF_HYPERDRIVE_ORIGIN }}
    steps:
      - name: Explain disabled Terraform plan
        if: env.TF_ENABLED != 'true'
        run: echo "Terraform import and no-op verification are not complete; remote plan is skipped."

      - name: Checkout code
        if: env.TF_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        if: env.TF_ENABLED == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Create sanitized Terraform plan summary
        if: env.TF_ENABLED == 'true'
        run: |
          set -euo pipefail
          terraform -chdir="infra/terraform/environments/${TF_ENVIRONMENT}" init -input=false
          if ! terraform -chdir="infra/terraform/environments/${TF_ENVIRONMENT}" plan \
            -input=false -lock=false -out=/tmp/terraform-plan >/dev/null; then
            echo "::error::Terraform plan failed. Inspect it locally without publishing sensitive plan data."
            exit 1
          fi
          terraform -chdir="infra/terraform/environments/${TF_ENVIRONMENT}" show \
            -json /tmp/terraform-plan \
            | jq -r '
              [.resource_changes[]? | select(.change.actions != ["no-op"]) |
               {address, actions: (.change.actions | join("/"))}] as $changes |
              ($changes[] | "\(.actions) \(.address)"),
              "create=" + (($changes | map(select(.actions == "create")) | length) | tostring) +
              " update=" + (($changes | map(select(.actions == "update")) | length) | tostring) +
              " delete=" + (($changes | map(select(.actions | contains("delete"))) | length) | tostring)' \
            | tee /tmp/terraform-change-summary.txt
          {
            echo "## Terraform plan (${TF_ENVIRONMENT})"
            echo '```text'
            if [[ -s /tmp/terraform-change-summary.txt ]]; then
              cat /tmp/terraform-change-summary.txt
            else
              echo "No resource changes."
            fi
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  lint-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-project

      - name: Build backend
        run: |
          cd apps/backend
          bun run build

      - name: Dry-run backend deployments
        run: |
          ./node_modules/.bin/wrangler deploy --config apps/backend/wrangler.jsonc --env dev --dry-run --outdir /tmp/backend-dev --minify
          ./node_modules/.bin/wrangler deploy --config apps/backend/wrangler.jsonc --env prod --dry-run --outdir /tmp/backend-prod --minify

      - name: Lint backend code
        run: |
          cd apps/backend
          bun run lint

      - name: Type check backend
        run: |
          cd apps/backend
          bun run type-check

      - name: Test backend
        run: |
          cd apps/backend
          bun run test

  verify-migration-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-project

      - name: Start CockroachDB
        run: |
          docker run -d \
            --name cockroachdb \
            -p 26257:26257 \
            cockroachdb/cockroach:latest \
            start-single-node --insecure
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health?ready=1 > /dev/null 2>&1; then
              echo "CockroachDB is ready"
              break
            fi
            echo "Waiting for CockroachDB... ($i/30)"
            sleep 2
          done

      - name: Create database
        run: |
          docker exec cockroachdb cockroach sql --insecure \
            -e 'CREATE DATABASE IF NOT EXISTS "basic-knowledge-for-web";'

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://root@localhost:26257/basic-knowledge-for-web?sslmode=disable
        run: |
          cd apps/backend
          bun run db:migrate

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-project

      - name: Build for Cloudflare
        run: |
          cd apps/frontend
          bun run build:cloudflare

      - name: Dry-run frontend deployments
        run: |
          ./node_modules/.bin/wrangler deploy --config apps/frontend/wrangler.jsonc --env dev --dry-run --outdir /tmp/frontend-dev
          ./node_modules/.bin/wrangler deploy --config apps/frontend/wrangler.jsonc --env prod --dry-run --outdir /tmp/frontend-prod

      - name: Lint frontend code
        run: |
          cd apps/frontend
          bun run lint

      - name: Type check frontend
        run: |
          cd apps/frontend
          bun run type-check

      - name: Test frontend
        run: |
          cd apps/frontend
          bun run test

  # Renovate が作成した PR のみを自動承認・自動マージします。
  # 以下をすべて満たす場合に限り実行する fail-closed 設計です（1 つでも欠ければスキップ）。
  #   1. ブランチ名が renovate/ プレフィックスであること
  #   2. PR 作成者が変数 RENOVATE_ACTOR（Renovate GitHub App の slug + [bot]）と一致すること。
  #      ブランチ名だけを条件にすると、書き込み権限を持つ利用者が renovate/* ブランチから PR を作るだけで
  #      通常のレビュー要件を迂回できてしまうため、実行主体の検証を必須にしています。
  #   3. ベースブランチが develop であること。main へリターゲットされた PR が
  #      develop での検証と dev デプロイを飛ばして本番へ入ることを防ぎます。
  #   4. fork からの PR ではないこと
  #   5. major-update ラベルが付いていないこと。依存パッケージのメジャー更新は renovate.json で
  #      そもそも作成されませんが、GitHub Actions のメジャー更新のみ PR が作られるため手動レビュー必須とします。
  #      Renovate は PR 作成と addLabels を別々の API 呼び出しで行うため（createPr が PR を作った直後に
  #      ラベルを付与する）、opened イベントの payload にはまだ major-update が載っていない場合があります。
  #      本ワークフローは labeled では再実行されず if: の判定も payload のスナップショットのままなので、
  #      承認・マージの直前に API で現在のラベルを取得して再確認します。
  renovate-auto-merge:
    runs-on: ubuntu-slim
    if: >-
      startsWith(github.head_ref, 'renovate/')
      && vars.RENOVATE_ACTOR != ''
      && github.event.pull_request.user.login == vars.RENOVATE_ACTOR
      && github.base_ref == 'develop'
      && github.repository == github.event.pull_request.head.repo.full_name
      && !contains(github.event.pull_request.labels.*.name, 'major-update')
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    needs: ["terraform-static", "lint-and-test-backend", "verify-migration-backend", "lint-and-test-frontend"]
    steps:
      # イベント payload ではなく現在のラベルを API から取得して再判定します。
      # gh の呼び出しが失敗した場合は変数代入が set -e で落ち、ジョブ自体が失敗して
      # 後続の承認・マージが実行されません（fail-closed）。
      - name: Re-check labels
        id: labels
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')"
          if grep -Fxq 'major-update' <<<"$labels"; then
            echo "major-update ラベルが付いているため自動マージをスキップします。"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Pull Request
        if: steps.labels.outputs.skip == 'false'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        if: steps.labels.outputs.skip == 'false'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
