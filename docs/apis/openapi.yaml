  /assets/{key}:
    get:
      operationId: getAsset
      tags:
      - Assets
      summary: ローカルBackendのR2画像配信
      description: Honoの /assets/* を表現する。keyは階層を含むR2キーで、実装は残りのパス全体を使用する。OpenAPIの単一path parameterだけではcatch-allのルーティングを保証できない。本番画像URLはSHOP_ITEM_ASSET_BASE_URLから構成し、このローカル配信URLとは区別する。
      x-hono-path: /assets/*
      servers:
      - url: http://localhost:8080
        description: ローカルBackendの配信ルート
      security: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        description: 'R2キー（例: programs/<eventId>/<file>.webp）。階層パスの扱いはクライアントツール側で確認する。'
      responses:
        '200':
          description: R2オブジェクトをそのまま返す。Content-Typeは保存されたhttpMetadata、未設定ならapplication/octet-stream。
          headers:
            Cache-Control:
              schema:
                const: public, max-age=31536000, immutable
              description: 1年の公開キャッシュ。
          content:
            '*/*':
              schema: {}
        '404':
          description: キーなし、またはオブジェクトがない。Honoの標準Not Found。
          content:
            text/plain:
              schema:
                type: string
              example: 404 Not Found
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    AuthCookie:
      type: apiKey
      in: cookie
      name: auth_token
      description: HS256 JWT。role=adminが必要なoperationではsecurity requirementにadminを指定する。BearerヘッダーではなくCookieで送る。
    AccessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: 会期閲覧用HS256 JWT。event_idとx-event-idの一致が必要。
  parameters:
    EventId:
      name: x-event-id
      in: header
      required: true
      description: 対象会期UUID。access_token使用時はJWT event_idと一致。編集POSTのevent_idとも一致させる。
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      description: 対象レコードのUUID。コントローラーで検証する。
      schema:
        type: string
        format: uuid
    AccessCodeId:
      name: id
      in: path
      required: true
      description: 会期ID。通常はUUIDだが、このルートはパスのUUID形式を事前検証しない。
      schema:
        type: string
    AccessCodeEventId:
      name: x-event-id
      in: header
      required: false
      description: access_tokenではJWTのevent_idと一致する値が必要。auth_token(admin)では省略可能。このAPIではUUID形式やパスidとの一致を検証しない。
      schema:
        type: string
  responses:
    BadRequest:
      description: 入力・ヘッダー・業務条件の検証に失敗。detailsはZod検証の場合に付与。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 有効なCookieがない、署名/期限不正、イベント不一致、または認証操作の失敗。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 管理者権限がない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 対象レコードまたはコピー元の部署がない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 部署を部屋割りまたはタイムテーブルで参照しているため削除できない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: 処理に失敗。ハンドラーのJSONエラーまたは未処理例外のHono標準text/plainエラー。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
          example: Internal Server Error
