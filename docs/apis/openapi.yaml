          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          minLength: 1
        image_key:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        display_order:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - event_id
      - title
      - content
      - display_order
      description: ' image_keyはothers/{x-event-id}/で始まるキー。'
    UpdateOtherItemInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          minLength: 1
        image_key:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        display_order:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      anyOf:
      - required:
        - title
      - required:
        - content
      - required:
        - image_key
      - required:
        - display_order
      description: 定義済み更新項目を1つ以上指定する。未知のキーはZodが除去するため、未知のキーだけでは更新できない。 image_keyはothers/{x-event-id}/で始まるキー。
