openapi: 3.2.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: BasicKnowledgeForWeb Backend API
  summary: スタッフポータルの現行HTTP API
  version: '2026-10-14'
  description: 実装済みのAPI契約。info.versionは文書の確認日であり、OpenAPIの規格版はopenapiで指定する。入力はZod、成功レスポンスはcontroller/use
    case/repository/schemaを照合。予定のメール検証・OTP・信頼デバイスAPIは含めない。認証のroleと会期一致条件はsecurityと各operationの説明を併用する。
servers:
- url: https://reitaisai.info
  description: prod（APIは/api配下）
- url: https://dev.reitaisai.info
  description: dev（APIは/api配下）
- url: http://localhost:8080
  description: ローカルBackend
tags:
- name: Health
  description: 稼働確認
- name: Auth
  description: 認証
- name: Users
  description: ユーザー
- name: AccessCodes
  description: 会期・アクセスコード
- name: Timetable
  description: 時間割
- name: Room
  description: 部屋割り
- name: Program
  description: 企画
- name: ShopItem
  description: 販売物
- name: Department
  description: 部署
- name: OtherItem
  description: その他情報
- name: Search
  description: 横断検索
- name: Assets
  description: 画像配信
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
      - Health
      summary: DB疎通を含む稼働状態を取得
      description: DB疎通を含む稼働状態を取得
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOK'
              example:
                status: ok
                db: connected
        '503':
          description: DB接続失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
              example:
                status: error
                db: disconnected
        '500':
          $ref: '#/components/responses/ServerError'
  /api/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: ログインしてauth_tokenを発行
      description: ログインしてauth_tokenを発行
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: ログインしました
          headers:
            Set-Cookie:
              schema:
                type: string
              description: auth_token=<JWT>; Max-Age=604800; Path=/; HttpOnly; Secure; SameSite=Lax。JWTの期限も7日。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: admin@example.com
              password: example-password
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: auth_tokenを削除
      description: auth_tokenを削除
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: ログアウトしました
          headers:
            Set-Cookie:
              schema:
                type: string
              description: auth_tokenをPath=/で失効させる。access_tokenは削除しない。
        '500':
          $ref: '#/components/responses/ServerError'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - Auth
      summary: ログイン中のユーザー情報を取得
      description: 有効なauth_tokenのpayloadからid/name/email/roleを返す。DBの再読込は行わない。
      security:
      - AuthCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/auth/password:
    put:
      operationId: changePassword
      tags:
      - Auth
      summary: パスワードを変更
      description: パスワードを変更
      security:
      - AuthCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: パスワードを変更しました
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
            example:
              currentPassword: old-password
              newPassword: new-password-123
  /api/users:
    get:
      operationId: getUsers
      tags:
      - Users
      summary: ユーザー一覧を取得
      description: adminのみ。createdAt降順。passwordは除去するが、deletedAtを含み、一覧の取得自体はsoft delete行を除外しない。
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                required:
                - users
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createUser
      tags:
      - Users
      summary: ユーザーを登録
      description: 公開登録API。roleは任意の1〜50文字を受け付ける。現行レスポンスにはpasswordのbcryptハッシュが含まれる。JSON解析失敗は500、検証エラーとuse
        case失敗は400。
      security: []
      responses:
        '201':
          description: ユーザー作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/RegisteredUser'
                required:
                - user
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
            example:
              name: スタッフ
              email: user@example.com
              password: example-password
  /api/users/{id}/role:
    put:
      operationId: updateUserRole
      tags:
      - Users
      summary: ユーザーのロールを変更
      description: ユーザーのロールを変更
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: ロールを変更しました
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleInput'
            example:
              role: admin
  /api/access-codes/verify:
    post:
      operationId: verifyAccessCode
      tags:
      - AccessCodes
      summary: アクセスコードを確認してaccess_tokenを発行
      description: アクセスコードを確認してaccess_tokenを発行
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: アクセスコードを確認しました
          headers:
            Set-Cookie:
              schema:
                type: string
              description: access_token=<JWT>; Path=/; HttpOnly; Secure; SameSite=Lax。Max-Age/Expiresはなくsession
                Cookie。JWT expは会期validTo。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAccessCodeInput'
            example:
              code: EXAMPLE2026
  /api/access-codes:
    get:
      operationId: getAccessCodes
      tags:
      - AccessCodes
      summary: 管理用の会期一覧を取得
      description: adminのみ。validFrom降順。
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessCode'
                required:
                - codes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createAccessCode
      tags:
      - AccessCodes
      summary: 会期とアクセスコードを作成
      description: 会期とアクセスコードを作成
      security:
      - AuthCookie:
        - admin
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: '#/components/schemas/AccessCode'
                required:
                - code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessCodeInput'
            example:
              code: EXAMPLE2026
              eventName: サンプル会期
              validFrom: '2026-10-01T00:00:00Z'
              validTo: '2026-11-01T00:00:00Z'
  /api/access-codes/{id}:
    get:
      operationId: getAccessCode
      tags:
      - AccessCodes
      summary: 会期詳細を取得
      description: 有効なaccess_tokenとx-event-idのevent_id一致、または有効なauth_tokenのrole=adminで許可。auth_token(user)単独では不可。
        auth_token(admin)ではx-event-idは不要。access_tokenが示す会期とパスidの一致はこのルートでは検証しない。
      security:
      - AccessCookie: []
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: '#/components/schemas/AccessCode'
                required:
                - code
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/AccessCodeId'
      - $ref: '#/components/parameters/AccessCodeEventId'
    delete:
      operationId: deleteAccessCode
      tags:
      - AccessCodes
      summary: 会期を削除
      description: adminのみ。参照中の会期などDB削除が失敗した場合、現行use caseは500を返す。
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: 削除しました
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/AccessCodeId'
  /api/timetable:
    get:
      operationId: getTimetableList
      tags:
      - Timetable
      summary: 時間割一覧を取得
      description: 有効なaccess_tokenとx-event-idのevent_id一致、または有効なauth_tokenのrole=adminで許可。auth_token(user)単独では不可。
        startTime昇順。
      security:
      - AccessCookie: []
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimetableItem'
                required:
                - items
          headers:
            Cache-Control:
              schema:
                const: no-store, max-age=0, must-revalidate
              description: 一覧のキャッシュを禁止。
            Pragma:
              schema:
                const: no-cache
              description: キャッシュ禁止。
            Expires:
              schema:
                const: '0'
              description: 即時失効。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: createTimetable
      tags:
      - Timetable
      summary: 時間割を作成
      description: 有効なauth_tokenのrole=adminとx-event-idが必要。ヘッダーのUUID検証をCookie認証より先に行う。 bodyのevent_idはx-event-idと一致すること。
      security:
      - AuthCookie:
        - admin
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/TimetableItem'
                required:
                - item
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimetableInput'
            example:
              event_id: 11111111-1111-4111-8111-111111111111
              title: 設営
              start_time: '2026-10-14T09:00:00Z'
  /api/timetable/{id}:
    put:
      operationId: updateTimetable
      tags:
      - Timetable
      summary: 時間割を部分更新
      description: 有効なauth_tokenのrole=adminとx-event-idが必要。ヘッダーのUUID検証をCookie認証より先に行う。 定義済み更新項目を1つ以上指定する。
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/TimetableItem'
                required:
                - item
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimetableInput'
    delete:
      operationId: deleteTimetable
      tags:
      - Timetable
      summary: 時間割を削除
      description: 有効なauth_tokenのrole=adminとx-event-idが必要。ヘッダーのUUID検証をCookie認証より先に行う。
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/Id'
  /api/rooms:
    get:
      operationId: getRoomList
      tags:
      - Room
      summary: 部屋割り一覧を取得
      description: 有効なaccess_tokenとx-event-idのevent_id一致、または有効なauth_tokenのrole=adminで許可。auth_token(user)単独では不可。
        buildingName→floor→roomName昇順。
      security:
      - AccessCookie: []
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                required:
                - rooms
          headers:
            Cache-Control:
              schema:
                const: no-store, max-age=0, must-revalidate
              description: 一覧のキャッシュを禁止。
            Pragma:
              schema:
                const: no-cache
              description: キャッシュ禁止。
            Expires:
              schema:
                const: '0'
              description: 即時失効。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: createRoom
      tags:
      - Room
      summary: 部屋割りを作成
      description: 有効なauth_tokenのrole=adminとx-event-idが必要。ヘッダーのUUID検証をCookie認証より先に行う。 bodyのevent_idはx-event-idと一致すること。
      security:
      - AuthCookie:
        - admin
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
                required:
                - room
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomInput'
            example:
              event_id: 11111111-1111-4111-8111-111111111111
              building_name: 本館
              floor: 1F
              room_name: '101'
              day_manager_id: 22222222-2222-4222-8222-222222222222
              day_purpose: 待機室
  /api/rooms/{id}:
    put:
      operationId: updateRoom
      tags:
      - Room
      summary: 部屋割りを部分更新
      description: 有効なauth_tokenのrole=adminとx-event-idが必要。ヘッダーのUUID検証をCookie認証より先に行う。 定義済み更新項目を1つ以上指定する。
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
                required:
                - room
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomInput'
    delete:
      operationId: deleteRoom
      tags:
      - Room
      summary: 部屋割りを削除
      description: 有効なauth_tokenのrole=adminとx-event-idが必要。ヘッダーのUUID検証をCookie認証より先に行う。
      security:
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/Id'
  /api/programs:
    get:
      operationId: getProgramList
      tags:
      - Program
      summary: 企画一覧を取得
      description: 有効なaccess_tokenとx-event-idのevent_id一致、または有効なauth_tokenのrole=adminで許可。auth_token(user)単独では不可。
        startTime昇順。
      security:
      - AccessCookie: []
      - AuthCookie:
        - admin
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Program'
                required:
                - programs
          headers:
            Cache-Control:
              schema:
                const: no-store, max-age=0, must-revalidate
              description: 一覧のキャッシュを禁止。
            Pragma:
              schema:
                const: no-cache
              description: キャッシュ禁止。
            Expires:
              schema:
                const: '0'
              description: 即時失効。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: createProgram
      tags:
      - Program
      summary: 企画を作成
